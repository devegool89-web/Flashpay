<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>لوحة التحكم | FLASH PAY</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style nonce="__NONCE__">
        :root { --gold: #FF9900; --gold-light: #FFD700; --gold-dark: #CC5500; --bg: #050507; --card: rgba(14, 14, 18, 0.92); --line: rgba(255, 153, 0, 0.25); --muted: #a0a0a0; --danger: #ff4757; --ok: #00e676; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background: var(--bg); color: #fff; min-height: 100vh; padding: 20px 14px 60px; }
        .wrap { max-width: 860px; margin: 0 auto; }
        .card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 22px 18px; margin-bottom: 20px; }
        h1 { color: var(--gold-light); font-size: 24px; font-weight: 900; } h2 { color: var(--gold-light); font-size: 19px; font-weight: 900; margin-bottom: 6px; }
        .sub { color: var(--muted); font-size: 13px; line-height: 1.7; margin-bottom: 18px; }
        .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .field { position: relative; margin-bottom: 20px; }
        .field label { position: absolute; right: 16px; top: -10px; background: #0e0e12; padding: 0 8px; color: var(--gold); font-size: 12px; font-weight: 700; border: 1px solid var(--line); border-radius: 5px; }
        textarea { width: 100%; background: rgba(0,0,0,0.6); border: 1px solid #333; color: #fff; padding: 15px 16px; border-radius: 14px; font-size: 15px; font-weight: 700; line-height: 1.7; resize: vertical; font-family: inherit; }
        input { width: 100%; background: rgba(0,0,0,0.6); border: 1px solid #333; color: #fff; padding: 15px 16px; border-radius: 14px; font-size: 16px; font-weight: 700; }
        button { font-family: inherit; cursor: pointer; padding: 14px 22px; border: none; border-radius: 14px; font-size: 16px; font-weight: 900; color: #000; background: linear-gradient(135deg, var(--gold-dark), var(--gold), var(--gold-light)); }
        .btn-block { width: 100%; } .btn-ghost { background: transparent; color: #fff; border: 1px solid #444; padding: 10px; }
        .btn-danger { background: transparent; color: var(--danger); border: 1px solid rgba(255,71,87,0.5); padding: 8px 14px; font-size: 13px; font-weight: 700; border-radius: 10px; }
        .rate-row { display: grid; grid-template-columns: 1fr; gap: 10px; padding: 14px 0; border-top: 1px dashed rgba(255,153,0,0.2); }
        .rate-cell { position: relative; } .rate-cell span { color: var(--gold); font-size: 12px; font-weight: 700; display: block; margin-bottom: 4px; }
        .client { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; border-top: 1px dashed rgba(255,153,0,0.2); }
        .client .meta { display: flex; flex-direction: column; gap: 6px; }
        .client .name { font-weight: 900; font-size: 18px; color: var(--gold-light); }
        .client .phone { font-size: 16px; direction: ltr; text-align: right; }
        .client .date { color: var(--muted); font-size: 11px; }
        
        .status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 900; width: fit-content; }
        .status-online { background: rgba(0, 230, 118, 0.1); color: #00e676; border: 1px solid #00e676; }
        .status-offline { background: rgba(160, 160, 160, 0.1); color: #a0a0a0; border: 1px solid #444; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; }
        .status-online .status-dot { background: #00e676; box-shadow: 0 0 8px #00e676; animation: blink 1.5s infinite; }
        .status-offline .status-dot { background: #666; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        #toast { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); background: #111; border: 1px solid var(--gold); border-radius: 16px; padding: 14px 22px; font-weight: 700; z-index: 50; transition: top 0.4s; }
        #toast.show { top: 18px; }
    </style>
</head>
<body>
    <main id="view-login" class="wrap" hidden>
        <div class="card" style="max-width: 420px; margin: 12vh auto;">
            <h1>لوحة التحكم</h1><p class="sub">دخول المدير فقط</p>
            <div class="field"><input type="password" id="login-password"><label>كلمة المرور</label></div>
            <button class="btn-block" id="btn-login">دخول</button>
            <div id="login-status" style="margin-top: 10px; color: var(--danger);"></div>
        </div>
    </main>

    <main id="view-dash" class="wrap" hidden>
        <div class="topbar"><h1>لوحة التحكم</h1><button class="btn-ghost" id="btn-logout">تسجيل الخروج</button></div>
        <section class="card">
            <h2>أسعار الصرف اليومية</h2><div id="rates-rows"></div>
            <button class="btn-block" id="btn-save-rates" style="margin-top: 16px;">حفظ الأسعار</button>
            <div id="rates-status" style="margin-top: 10px; color: var(--muted); font-size: 13px;"></div>
        </section>
        <section class="card">
            <h2>🔔 إشعارات للمستخدمين</h2>
            <p class="sub">تصل إلى شريط إشعارات موبايل المشتركين حتى لو كان الموقع مغلقاً. عدد المشتركين: <b id="push-count" style="color:var(--gold-light)">0</b></p>
            <div class="field"><input type="text" id="push-title" maxlength="80" value="تحديث أسعار الصرف"><label>عنوان الإشعار</label></div>
            <div class="field"><textarea id="push-body" rows="6" maxlength="400"></textarea><label>نص الإشعار</label></div>
            <button type="button" class="btn-ghost btn-block" id="btn-push-fill">تعبئة النص من الأسعار الحالية</button>
            <button type="button" class="btn-block" id="btn-push-send" style="margin-top: 12px;">إرسال الإشعار الآن</button>
            <div id="push-status" style="margin-top: 10px; color: var(--muted); font-size: 13px;"></div>
        </section>
        <section class="card">
            <h2>العملاء المسجلون: <span id="clients-total" style="color:var(--gold-light)">0</span></h2>
            <p class="sub">يتم تحديث حالة الاتصال (نشط/غير متصل) تلقائياً كل 10 ثوانٍ.</p>
            <div class="field"><input type="search" id="client-search"><label>بحث بالاسم أو الرقم</label></div>
            <div id="clients-list"></div>
        </section>
    </main>
    <div id="toast"></div>

    <script nonce="__NONCE__">
        const CUR_INFO = { USD: 'دولار أمريكي', USDT: 'تيثر USDT', EUR: 'يورو', LBP: 'ليرة لبنانية', JOD: 'دينار أردني', LYD: 'دينار ليبي', KWD: 'دينار كويتي' };
        const $ = id => document.getElementById(id);
        const esc = v => String(v ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
        let currencies = [];
        let lastRates = null;
        
        function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3500); }
        function show(v) { $('view-login').hidden = v !== 'login'; $('view-dash').hidden = v !== 'dash'; }

        async function api(method, url, body) {
            const opt = { method, headers: {} };
            if (body) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
            let r = await fetch(url, opt);
            if (r.status === 401 && url !== '/api/admin/login') { show('login'); throw new Error('انتهت الجلسة'); }
            if (!r.ok) throw new Error('حدث خطأ');
            return await r.json();
        }

        async function login() {
            try { await api('POST', '/api/admin/login', { password: $('login-password').value }); await loadDash(); } catch (e) { $('login-status').textContent = 'كلمة المرور خاطئة'; }
        }

        async function saveRates() {
            const payload = {};
            for (const c of currencies) {
                payload[c] = { buy: parseFloat($(`rate-${c}-buy`).value), sell: parseFloat($(`rate-${c}-sell`).value) };
            }
            $('btn-save-rates').disabled = true;
            try { await api('PUT', '/api/admin/rates', { rates: payload }); lastRates = payload; $('push-body').value = ratesText(); toast('تم حفظ الأسعار'); } catch (e) { toast('خطأ في الأرقام'); }
            $('btn-save-rates').disabled = false;
        }

        function ratesText() {
            if (!lastRates) return '';
            const lines = ['المكتب يشتري / يبيع:'];
            for (const c of currencies) { const r = lastRates[c]; if (r) lines.push(`${CUR_INFO[c]}: ${r.buy} / ${r.sell}`); }
            return lines.join('\n');
        }
        async function sendPush() {
            const title = $('push-title').value.trim(), body = $('push-body').value.trim();
            if (!title || !body) return toast('اكتب العنوان والنص أولاً');
            const n = Number($('push-count').textContent) || 0;
            if (n === 0) return toast('لا يوجد مشتركون بعد');
            if (!confirm('إرسال الإشعار إلى ' + n + ' مشترك؟')) return;
            $('btn-push-send').disabled = true;
            try {
                const r = await api('POST', '/api/admin/push/send', { title, body });
                $('push-status').textContent = `أُرسل إلى ${r.sent} من ${r.total}` + (r.failed ? ` — فشل ${r.failed}` : '') + (r.removed ? ` — حُذف ${r.removed} اشتراك منتهي` : '');
                toast('تم الإرسال');
                const st = await api('GET', '/api/admin/state'); $('push-count').textContent = st.pushSubscribers;
            } catch (e) { toast('تعذّر الإرسال'); }
            $('btn-push-send').disabled = false;
        }

        function buildRateRows(rates) {
            $('rates-rows').innerHTML = currencies.map(c => `
                <div class="rate-row">
                    <div style="font-weight:900">${c} - <small>${CUR_INFO[c]}</small></div>
                    <div class="rate-cell"><span>المكتب يشتري بـ</span><input type="number" id="rate-${c}-buy" value="${rates?.[c]?.buy||''}"></div>
                    <div class="rate-cell"><span>المكتب يبيع بـ</span><input type="number" id="rate-${c}-sell" value="${rates?.[c]?.sell||''}"></div>
                </div>`).join('');
        }

        function renderClients(list, total) {
            $('clients-total').textContent = total;
            $('clients-list').innerHTML = list.length === 0 ? '<div style="text-align:center;color:#666;padding:20px;">لا يوجد عملاء</div>' : list.map(c => `
                <div class="client">
                    <div class="meta">
                        <div class="name">${esc(c.name) || 'بدون اسم'}</div>
                        <div class="phone">${esc(c.phone)}</div>
                        <div class="status-badge ${c.isOnline ? 'status-online' : 'status-offline'}">
                            <div class="status-dot"></div> ${c.isOnline ? 'نشط الآن يتابع الأسعار' : 'غير متصل'}
                        </div>
                        <div class="date">تاريخ التسجيل: ${new Date(c.createdAt).toLocaleString('ar-SY')}</div>
                    </div>
                    <button class="btn-danger" data-del="${esc(c.id)}">حذف</button>
                </div>`).join('');
        }

        async function loadClients() {
            const q = $('client-search').value.trim();
            const data = await api('GET', '/api/admin/clients' + (q ? '?q=' + encodeURIComponent(q) : ''));
            renderClients(data.clients, data.total);
        }

        async function deleteClient(id) {
            if (!confirm('حذف العميل؟')) return;
            await api('DELETE', '/api/admin/clients/' + id);
            loadClients();
        }

        async function loadDash() {
            const state = await api('GET', '/api/admin/state');
            currencies = state.currencies; lastRates = state.rates; $('push-count').textContent = state.pushSubscribers || 0;
            buildRateRows(state.rates);
            show('dash');
            await loadClients();
        }

        $('btn-login').onclick = login;
        $('btn-logout').onclick = async () => { try { await api('POST', '/api/admin/logout'); } catch (e) {} show('login'); };
        $('clients-list').addEventListener('click', e => { const b = e.target.closest('[data-del]'); if (b) deleteClient(b.dataset.del); });$('btn-save-rates').onclick = saveRates;
        $('client-search').oninput = loadClients;
        $('btn-push-fill').onclick = () => { $('push-body').value = ratesText(); };
        $('btn-push-send').onclick = sendPush;

        async function refreshPushCount() { try { const st = await api('GET', '/api/admin/state'); $('push-count').textContent = st.pushSubscribers || 0; } catch (e) {} }
        setInterval(() => { if (!$('view-dash').hidden) { loadClients(); refreshPushCount(); } }, 10000);

        (async function init() { try { await loadDash(); } catch (e) { show('login'); } })();
    </script>
</body>
</html>
